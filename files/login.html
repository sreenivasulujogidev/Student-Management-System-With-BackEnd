<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link href="/css/loginPage.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <form class="loginForm signin active">
        <h3 id="title">SIGN IN</h3>
        <div class="inputFields">
          <input
            type="text"
            placeholder="Enter username"
            id="username"
            name="userName"
            required
          />
          <div class="password">
            <input
              type="password"
              placeholder="Enter Password"
              id="passwordField"
              name="passWord"
              required
            />
            <button type="button" id="showPassword">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="captchabox">
            <div>
              <p id="captcha">XREVGT</p>
              <button type="button" id="refreshCaptcha">
                <i class="fa-solid fa-arrows-rotate"></i>
              </button>
            </div>
            <input
              type="text"
              placeholder="Enter Above Captcha"
              name="captcha"
            />
          </div>
        </div>
        <div class="buttons">
          <button type="submit" id="submit">SIGN IN</button>
          <div class="Not-A-Member">
            <p>
              Don't have an account?
              <span id="signup">Sign up</span>
            </p>
          </div>
        </div>
        <p id="signInResult"></p>
      </form>
      <form class="loginForm signup">
        <h2 id="signUptitle">SIGN UP</h2>
        <div class="inputFields">
          <input type="text" placeholder="UserName" name="userName" required />
          <div class="signUppasswordFieldBox">
            <input
              type="password"
              placeholder="Password"
              id="signUPpasswordField"
              name="passWord"
              required
            />
            <i class="fa-solid fa-eye" id="SignUPshowPassword"></i>
          </div>
          <input
            type="tel"
            placeholder="Mobile Number"
            maxlength="10"
            pattern="[0-9]{10}"
            name="mobileNumber"
            required
          />
        </div>
        <div class="buttons">
          <button type="submit">Sign up</button>
        </div>
        <div class="Already-A-Member">
          <p>
            Already have an account?
            <span id="signin">Sign in</span>
          </p>
        </div>
        <p id="signUpResult"></p>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="/js/login.js"></script>
  </body>
</html>
